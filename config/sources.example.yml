sources:
  US:
    - id: newsdata_us_business_news
      type: api
      provider: newsdata
      publisher: NewsData.io
      endpoint: https://newsdata.io/api/1/latest
      query: business
      query_version: 2026-08-08.v1
      source_country: us
      source_language: en
      enabled: true
      terms_status: approved_free_delayed_attribution
      terms_checked_at: 2026-08-08
      terms_review_due_at: 2026-09-07
      allowed_fields: [title, url, publisher, published_at]
    - id: gdelt_us_economic_news
      type: api
      provider: gdelt
      publisher: GDELT Project
      endpoint: https://api.gdeltproject.org/api/v2/doc/doc
      query: domain:wsj.com OR domain:bloomberg.com OR domain:cnbc.com OR domain:marketwatch.com OR domain:nytimes.com OR domain:fortune.com OR domain:businessinsider.com OR domain:reuters.com
      query_version: 2026-08-07.v1
      source_country: UnitedStates
      source_language: English
      allowed_domains: [wsj.com, bloomberg.com, cnbc.com, marketwatch.com, nytimes.com, fortune.com, businessinsider.com, reuters.com]
      enabled: true
      terms_status: approved_free_attribution_required
      terms_checked_at: 2026-08-07
      terms_review_due_at: 2026-11-05
      allowed_fields: [title, url, publisher, published_at]
    - id: federal_reserve_all_releases
      type: rss
      publisher: Federal Reserve
      feed_url: https://www.federalreserve.gov/feeds/press_all.xml
      enabled: true
      terms_status: approved
      terms_checked_at: 2026-08-06
      terms_review_due_at: 2026-11-04
      allowed_fields: &public_rss_fields [title, summary, url, publisher, published_at]
    - id: census_economic_indicators
      type: rss
      publisher: U.S. Census Bureau
      feed_url: https://www.census.gov/economic-indicators/indicator.xml
      enabled: true
      terms_status: approved_public_rss
      terms_checked_at: 2026-08-08
      terms_review_due_at: 2026-11-06
      allowed_fields: *public_rss_fields
    - id: bea_news_releases
      type: rss
      publisher: U.S. Bureau of Economic Analysis
      feed_url: https://apps.bea.gov/rss/rss.xml
      enabled: true
      terms_status: approved_public_domain
      terms_checked_at: 2026-08-08
      terms_review_due_at: 2026-11-06
      allowed_fields: *public_rss_fields
    - id: bls_employment_situation
      type: rss
      publisher: U.S. Bureau of Labor Statistics
      feed_url: https://www.bls.gov/feed/empsit.rss
      enabled: false
      terms_status: automated_access_blocked
      terms_checked_at: 2026-08-06
      terms_review_due_at: 2026-11-04
      allowed_fields: *public_rss_fields
    - id: bls_consumer_price_index
      type: rss
      publisher: U.S. Bureau of Labor Statistics
      feed_url: https://www.bls.gov/feed/cpi.rss
      enabled: false
      terms_status: automated_access_blocked
      terms_checked_at: 2026-08-06
      terms_review_due_at: 2026-11-04
      allowed_fields: *public_rss_fields
    - id: bea_api
      type: api
