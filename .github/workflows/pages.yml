name: Publish Country Issue Cloud Pages

on:
  push:
    branches:
      - main
  schedule:
    # 毎日09:00 JST/KST（00:00 UTC）に実行する。
    - cron: "0 0 * * *"
    # 10:00と12:00 JST/KSTは未実行日の補完候補とする。
    - cron: "0 1 * * *"
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      data_mode:
        description: Data source used to build the Pages artifact
        required: true
        default: live
        type: choice
        options:
          - live
          - fixture
      force_live_retry:
        description: Allow one deliberate live retry after today's attempt marker exists
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: country-issue-cloud-pages
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      data-mode: ${{ steps.context.outputs.data-mode }}
      date-key: ${{ steps.context.outputs.date-key }}
      marker-key: ${{ steps.context.outputs.marker-key }}
      should-run: ${{ steps.decision.outputs.should-run }}
    steps:
      - name: Resolve execution context
        id: context
        shell: bash
        run: |
          mode="fixture"
          force="false"
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            mode="live"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            mode="${{ inputs.data_mode }}"
            force="${{ inputs.force_live_retry }}"
          fi
          date_key="$(TZ=Asia/Tokyo date +%F)"
          echo "data-mode=$mode" >> "$GITHUB_OUTPUT"
          echo "force=$force" >> "$GITHUB_OUTPUT"
          echo "date-key=$date_key" >> "$GITHUB_OUTPUT"
          echo "marker-key=pages-live-attempt-$date_key" >> "$GITHUB_OUTPUT"

      - name: Restore today's live-attempt marker
        if: steps.context.outputs.data-mode == 'live' && steps.context.outputs.force != 'true'
        id: marker-cache
        uses: actions/cache/restore@v4
        with:
          path: .runtime/pages-run-marker
          key: ${{ steps.context.outputs.marker-key }}
          lookup-only: true

      - name: Decide whether collection may run
        id: decision
        shell: bash
        run: |
          should_run="true"
          if [[ "${{ steps.context.outputs.data-mode }}" == "live" \
             && "${{ steps.context.outputs.force }}" != "true" \
             && "${{ steps.marker-cache.outputs.cache-hit }}" == "true" ]]; then
            should_run="false"
          fi
          echo "should-run=$should_run" >> "$GITHUB_OUTPUT"
          echo "date=${{ steps.context.outputs.date-key }} mode=${{ steps.context.outputs.data-mode }} cache-hit=${{ steps.marker-cache.outputs.cache-hit }} force=${{ steps.context.outputs.force }} should-run=$should_run"

  build:
    needs: gate
    if: needs.gate.outputs.should-run == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    outputs:
      artifact-name: github-pages

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.32"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Synchronize locked dependencies
        run: uv sync --project backend --locked --group dev

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install web dependencies
        run: npm ci --prefix frontend

      - name: Verify source
        shell: pwsh
        run: .\scripts\verify-all.ps1

      - name: Claim today's live attempt
        if: needs.gate.outputs.data-mode == 'live'
        shell: pwsh
        run: |
          $marker = "${{ github.workspace }}\.runtime\pages-run-marker\${{ needs.gate.outputs.date-key }}.json"
          New-Item -ItemType Directory -Path (Split-Path -Parent $marker) -Force | Out-Null
          [ordered]@{
            date_jst = "${{ needs.gate.outputs.date-key }}"
            run_id = "${{ github.run_id }}"
            claimed_at_utc = [datetime]::UtcNow.ToString("o")
            state = "external_collection_claimed"
          } | ConvertTo-Json | Set-Content -LiteralPath $marker -Encoding utf8

      - name: Persist today's live-attempt marker before collection
        if: needs.gate.outputs.data-mode == 'live'
        uses: actions/cache/save@v4
        with:
          path: .runtime/pages-run-marker
          key: ${{ needs.gate.outputs.marker-key }}

      - name: Build validated Pages artifact
        shell: pwsh
        run: .\scripts\build-pages-site.ps1 -Mode "${{ needs.gate.outputs.data-mode }}" -OutputDirectory "${{ github.workspace }}\dist\site" -AttemptMarkerPath "${{ github.workspace }}\.runtime\pages-run-marker\${{ needs.gate.outputs.date-key }}.json"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ github.workspace }}\dist\site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
