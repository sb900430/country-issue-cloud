name: Secret protection

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-protection-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Scan repository secrets
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check synchronized specifications
        shell: pwsh
        run: .\scripts\check-spec-sync.ps1

      - name: Scan blocked files and secret patterns
        shell: pwsh
        run: .\scripts\check-secrets.ps1
