[project]
name = "country-issue-cloud-backend"
version = "0.1.0"
description = "Local-first backend for Country Issue Cloud"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.139.2,<0.140",
    "httpx>=0.28,<0.29",
    "pydantic-settings>=2.12,<3",
    "pyyaml>=6.0,<7",
    "tzdata>=2026.1",
    "uvicorn[standard]>=0.41,<0.42",
]

[dependency-groups]
dev = [
    "mypy>=1.19,<2",
    "pytest>=9,<10",
    "ruff>=0.15,<0.16",
    "types-pyyaml>=6.0,<7",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
