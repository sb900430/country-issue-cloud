<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="한국·미국·일본의 오늘 이슈를 한눈에 보는 국가별 이슈 클라우드" />
    <title>국가별 이슈 클라우드</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="site-header">
        <a class="brand" href="./" aria-label="국가별 이슈 클라우드 홈">
          <strong>국가별 이슈 클라우드</strong>
          <small>Country Issue Cloud</small>
        </a>
        <time class="current-date" data-current-date>—</time>
      </header>

      <nav class="country-tabs" data-countries aria-label="국가 선택">
        <button data-country="US" aria-pressed="false">미국 <small>US</small></button>
        <button data-country="JP" aria-pressed="false">일본 <small>JP</small></button>
        <button data-country="KR" class="is-active" aria-pressed="true">한국 <small>KR</small></button>
      </nav>

      <section class="date-section" aria-label="날짜 선택">
        <select class="sr-only" data-date aria-label="날짜 선택"></select>
        <div class="date-strip" data-date-strip></div>
      </section>

      <main>
        <section class="issue-panel" aria-labelledby="issues-title">
          <div class="panel-heading">
            <p class="analysis-summary">분석 기사 <strong data-article-count>—</strong>건 <span>·</span> <time data-generated>—</time> 업데이트</p>
            <div class="display-controls">
              <label class="segmented-switch language-switch">
                <input type="checkbox" data-keyword-language aria-label="키워드를 한국어로 표시" checked />
                <span class="switch-option switch-option--first">원문</span>
                <span class="switch-option switch-option--second">한국어</span>
              </label>
              <label class="segmented-switch layout-switch">
                <input type="checkbox" data-layout aria-label="클라우드형으로 전환" />
                <span class="switch-option switch-option--first">▦ 타일</span>
                <span class="switch-option switch-option--second">☁ 클라우드</span>
              </label>
            </div>
          </div>
          <h1 class="sr-only" id="issues-title">오늘의 주요 경제 키워드 최대 5개</h1>
          <p class="run-status" data-run-status hidden></p>
          <div class="issues issues--tiles" data-issues aria-live="polite"></div>
          <p class="status" data-status role="status"></p>
          <button class="retry" type="button" data-retry hidden>다시 시도 · 再試行</button>
        </section>
      </main>

      <footer>
        <button class="refresh" type="button" data-refresh>↻ 새로고침</button>
        <a href="./about.html">출처 · 개인정보 · 문의</a>
      </footer>
    </div>

    <dialog class="detail" data-dialog>
      <form method="dialog"><button class="detail__close" data-dialog-close aria-label="닫기">×</button></form>
      <p class="eyebrow">SOURCE ARTICLES</p><h2 data-dialog-title></h2><ul data-dialog-articles></ul>
    </dialog>
    <script type="module" src="./src/app.js"></script>
  </body>
</html>
